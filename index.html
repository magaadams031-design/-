<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TZN 228 — Номера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, #1a1a1a, #000);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    
    .menu-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .menu-btn:hover { transform: scale(1.1); color: #ff9800; }

    .top-stats {
      display: flex;
      gap: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(0,0,0,0.6);
      padding: 8px 15px;
      border-radius: 10px;
      border: 1px solid #222;
    }
    .stat-item span { color: #4caf50; font-weight: 800; }
    .stat-item.garage-stat span { color: #4fc3f7; }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      cursor: pointer;
      padding-top: 60px;
    }

    .real-plate {
      display: flex;
      background: #e6e6e6;
      border: 3px solid #000;
      border-radius: 8px;
      padding: 10px 20px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 40px;
      transition: all 0.2s ease;
      position: relative;
      font-family: 'Arial Narrow', Arial, sans-serif;
      width: 90%;
      max-width: 700px;
      justify-content: space-between;
    }
    .real-plate.generating { opacity: 0.3; filter: blur(3px); }

    .plate-left { display: flex; align-items: center; position: relative; flex: 1; padding-left: 20px; }

    .plate-text { font-size: 6.5rem; font-weight: 900; color: #000; letter-spacing: 4px; line-height: 1; text-shadow: 1px 1px 0px rgba(0,0,0,0.2); }

    .plate-right { display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 3px solid #000; padding-left: 20px; padding-right: 10px; }

    .plate-region { font-size: 2rem; font-weight: bold; color: #000; line-height: 1; margin-bottom: 5px; letter-spacing: 1px; }

    .plate-rus-box { display: flex; align-items: center; gap: 5px; }
    .plate-rus { font-size: 1rem; font-weight: bold; color: #000; line-height: 1; }
    .flag-small { display: flex; flex-direction: column; width: 20px; height: 14px; border: 1px solid #000; }
    .f-white { flex: 1; background: #fff; }
    .f-blue { flex: 1; background: #0039a6; }
    .f-red { flex: 1; background: #d52b1e; }

    .bolt { width: 12px; height: 12px; background: #333; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.5); }
    .bolt-left { left: 5px; }
    .bolt-right { left: 30px; }

    .rarity-tag { font-size: 1.2rem; font-weight: 800; padding: 10px 30px; border-radius: 30px; background: #222; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; }
    .rarity-tag.legendary { background: linear-gradient(90deg, #ffd54f, #ff9800); color: #000; box-shadow: 0 0 30px #ffd54f; }
    .rarity-tag.mythic { background: linear-gradient(90deg, #e91e63, #9c27b0); color: #fff; box-shadow: 0 0 30px #e91e63; }
    .rarity-tag.ultra { background: linear-gradient(90deg, #00bcd4, #3f51b5); color: #fff; box-shadow: 0 0 30px #00bcd4; }
    .rarity-tag.epic { background: rgba(186, 104, 200, 0.2); color: #ba68c8; border: 1px solid #ba68c8; }
    .rarity-tag.rare { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; border: 1px solid #4fc3f7; }
    .rarity-tag.common { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid #555; }
    
    .price-display { font-size: 2.5rem; font-weight: 900; color: #4caf50; text-shadow: 0 0 20px rgba(76, 175, 80, 0.5); opacity: 0; transition: opacity 0.3s; }
    .price-display.show { opacity: 1; }

    /* Модальное окно */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    
    .modal-content {
      background: #111; border: 1px solid #333; border-radius: 20px;
      width: 90%; max-width: 700px; padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      max-height: 85vh; overflow-y: auto;
    }
    .modal-content h2 { margin-bottom: 20px; font-size: 1.8rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .close-btn { float: right; cursor: pointer; color: #f44336; font-size: 1.5rem; font-weight: bold; }
    .close-btn:hover { color: #ff5252; }

    .upgrade-item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .upgrade-btn { background: #4caf50; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .upgrade-btn:hover { background: #5cb860; }
    .upgrade-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* Сетки номеров в меню */
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    
    .inv-card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px;
      display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
    }
    .inv-card.legendary { border-color: #ffd54f; }
    .inv-card.ultra { border-color: #00bcd4; }
    .inv-card.mythic { border-color: #e91e63; }

    .inv-card .card-plate { background: #fff; color: #000; padding: 5px 10px; border-radius: 5px; font-family: monospace; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; border: 2px solid #000; }
    .inv-card .card-price { color: #4caf50; font-weight: bold; font-size: 1rem; margin-bottom: 10px; }
    
    .card-actions { display: flex; gap: 5px; width: 100%; }
    .card-btn { flex: 1; padding: 8px 0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; color: #fff; }
    .btn-sell { background: #4caf50; }
    .btn-sell:hover { background: #5cb860; }
    .btn-safe { background: #2196f3; }
    .btn-safe:hover { background: #42a5f5; }
    .btn-unsafe { background: #ff9800; color: #000; }
    .btn-unsafe:hover { background: #ffa726; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #000; border: 2px solid #ffd54f; padding: 20px 40px; border-radius: 16px; text-align: center; z-index: 1000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 50px rgba(255, 213, 79, 0.4); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast h3 { color: #ffd54f; font-size: 1.5rem; margin-bottom: 5px; }
    .toast p { font-size: 1.2rem; color: #fff; }
    .toast .toast-price { color: #4caf50; font-size: 1.8rem; font-weight: 900; margin-top: 10px; }

    @media (max-width: 600px) {
      .plate-text { font-size: 4rem; letter-spacing: 2px; }
      .plate-region { font-size: 1.5rem; }
      .top-stats { font-size: 0.8rem; gap: 10px; padding: 5px 10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="top-stats">
      <div class="stat-item">Баланс: <span id="score">0</span> ₽</div>
      <div class="stat-item garage-stat">В гараже: <span id="count">0</span>/<span id="maxGarage">10</span></div>
    </div>
  </div>

  <div class="game-area" id="gameArea">
    <div class="real-plate" id="plateContainer">
      <div class="plate-left">
        <div class="bolt bolt-left"></div>
        <div class="bolt bolt-right"></div>
        <div class="plate-text" id="plateText">---</div>
      </div>
      <div class="plate-right">
        <div class="plate-region" id="plateRegion">77</div>
        <div class="plate-rus-box">
          <div class="plate-rus">RUS</div>
          <div class="flag-small">
            <div class="f-white"></div>
            <div class="f-blue"></div>
            <div class="f-red"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="rarity" class="rarity-tag common">НАЖМИ, ЧТОБЫ КРУТИТЬ</div>
    <div id="price" class="price-display">0 ₽</div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО (МЕНЮ) -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">✖</span>
      <h2>Меню</h2>
      
      <!-- ПРОКАЧКА -->
      <h3 style="margin-bottom: 15px; color: #aaa;">Улучшения</h3>
      <div class="upgrade-item">
        <div>
          <div style="font-weight: bold;">Расширение гаража</div>
          <div style="font-size: 0.8rem; color: #888;">+5 слотов (Текущий максимум: <span id="menuMaxGarage">10</span>)</div>
        </div>
        <button class="upgrade-btn" id="upgradeBtn">500 000 ₽</button>
      </div>

      <!-- ГАРАЖ -->
      <h3 style="margin: 25px 0 15px; color: #aaa;">🚗 Мой Гараж</h3>
      <div class="inv-grid" id="menuGarage">
        <div style="color: #555;">Пока пусто...</div>
      </div>

      <!-- СЕЙФ -->
      <h3 style="margin: 25px 0 15px; color: #aaa;">🔒 Сейф (Топ-номера)</h3>
      <div class="inv-grid" id="menuSafe">
        <div style="color: #555;">Пока пусто...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <h3 id="toastTitle">ЛЕГЕНДА!</h3>
    <p id="toastText">Вы выбили номер!</p>
    <div class="toast-price" id="toastPrice">0 ₽</div>
  </div>

  <script>
    const letters = ["А","В","Е","К","М","Н","О","Р","С","Т","У","Х"];
    const regions = ["77","50","99","78","47","23","61","16","02","66","52","24"];
    
    let score = parseInt(localStorage.getItem("score")) || 0;
    let garage = JSON.parse(localStorage.getItem("garage")) || [];
    let safe = JSON.parse(localStorage.getItem("safe")) || [];
    let maxGarage = parseInt(localStorage.getItem("maxGarage")) || 10;
    let currentPlate = null, currentRarity = "common", currentPrice = 0;
    let isGenerating = false;

    const scoreEl = document.getElementById("score"), countEl = document.getElementById("count"), maxGarageEl = document.getElementById("maxGarage");
    const menuMaxGarageEl = document.getElementById("menuMaxGarage");
    const plateContainer = document.getElementById("plateContainer"), plateTextEl = document.getElementById("plateText"), plateRegionEl = document.getElementById("plateRegion");
    const rarityEl = document.getElementById("rarity"), priceEl = document.getElementById("price");
    const gameArea = document.getElementById("gameArea");
    const modal = document.getElementById("modal"), menuBtn = document.getElementById("menuBtn"), closeModal = document.getElementById("closeModal");
    const upgradeBtn = document.getElementById("upgradeBtn");
    const menuGarage = document.getElementById("menuGarage"), menuSafe = document.getElementById("menuSafe");
    const toast = document.getElementById("toast"), toastTitle = document.getElementById("toastTitle"), toastText = document.getElementById("toastText"), toastPrice = document.getElementById("toastPrice");

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function formatMoney(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

    function save() {
      localStorage.setItem("score", score);
      localStorage.setItem("garage", JSON.stringify(garage));
      localStorage.setItem("safe", JSON.stringify(safe));
      localStorage.setItem("maxGarage", maxGarage);
    }

    function generatePlate() {
      const roll = Math.random() * 100;
      
      if (roll < 0.05) return { text: "Т228ЗОН", region: "228", rarity: "mythic", points: 150000000 };
      if (roll < 0.2) return { text: "О001ОО", region: "77", rarity: "mythic", points: 50000000 };
      if (roll < 0.7) return { text: "А777АА", region: "99", rarity: "ultra", points: 15000000 };
      if (roll < 2.2) return { text: "Е999КХ", region: "50", rarity: "legendary", points: 5000000 };

      const l1 = rand(letters), digits = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0"), l2 = rand(letters), l3 = rand(letters), region = rand(regions);
      const text = `${l1}${digits}${l2}${l3}`;
      
      const d = digits.split("");
      if (d[0] === d[1] || d[1] === d[2] || l1 === l2 || l2 === l3 || l1 === l3) 
        return { text, region, rarity: "epic", points: 800000 };
      if (digits === "123" || digits === "321" || digits === "789" || digits === "987") 
        return { text, region, rarity: "rare", points: 200000 };
      
      return { text, region, rarity: "common", points: Math.floor(Math.random() * 50000) + 30000 };
    }

    function spin() {
      if (isGenerating) return;
      isGenerating = true;
      
      const roll = Math.random() * 100;
      const isTopTier = roll < 2.2; 

      if (isTopTier) {
        plateContainer.classList.add("generating");
        rarityEl.className = "rarity-tag common";
        rarityEl.textContent = "КРУТИМ...";
        priceEl.classList.remove("show");
        priceEl.textContent = "";
        
        let ticks = 0;
        const spinInterval = setInterval(() => {
          const temp = generatePlate();
          plateTextEl.textContent = temp.text;
          plateRegionEl.textContent = temp.region;
          ticks++;
          if (ticks > 15) {
            clearInterval(spinInterval);
            finishSpin();
          }
        }, 50);
      } else {
        finishSpin();
      }
    }

    function finishSpin() {
      const result = generatePlate();
      currentPlate = result.text;
      currentRarity = result.rarity;
      currentPrice = result.points;
      
      plateContainer.classList.remove("generating");
      plateTextEl.textContent = result.text;
      plateRegionEl.textContent = result.region;
      
      rarityEl.className = "rarity-tag " + result.rarity;
      rarityEl.textContent = getRarityName(result.rarity);
      
      priceEl.textContent = `${formatMoney(result.points)} ₽`;
      priceEl.classList.add("show");
      
      isGenerating = false;

      if (["legendary", "ultra", "mythic"].includes(result.rarity)) {
        showToast(result);
      }
    }

    function getRarityName(r) {
      if (r === "mythic") return "МИФИЧЕСКИЙ";
      if (r === "ultra") return "УЛЬТРА";
      if (r === "legendary") return "ЛЕГЕНДАРНЫЙ";
      if (r === "epic") return "ЭПИЧЕСКИЙ";
      if (r === "rare") return "РЕДКИЙ";
      return "ОБЫЧНЫЙ";
    }

    function collect() {
      if (isGenerating || !currentPlate) return;
      
      if (["legendary", "ultra", "mythic"].includes(currentRarity)) {
        safe.push({ text: currentPlate, rarity: currentRarity, price: currentPrice });
      } else {
        if (garage.length >= maxGarage) {
          alert("Гараж переполнен! Купи улучшение или продай что-нибудь.");
          return;
        }
        garage.push({ text: currentPlate, rarity: currentRarity, price: currentPrice });
      }
      
      score += currentPrice;
      
      currentPlate = null;
      plateTextEl.textContent = "---";
      plateRegionEl.textContent = "77";
      rarityEl.className = "rarity-tag common";
      rarityEl.textContent = "НАЖМИ, ЧТОБЫ КРУТИТЬ";
      priceEl.classList.remove("show");
      priceEl.textContent = "";
      
      save();
      render();
    }

    function showToast(res) {
      toastTitle.textContent = getRarityName(res.rarity) + "!";
      toastText.textContent = res.text + " (" + res.region + ")";
      toastPrice.textContent = formatMoney(res.points) + " ₽";
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Отрисовка меню (гараж и сейф)
    function renderMenu() {
      menuMaxGarageEl.textContent = maxGarage;
      
      // Гараж
      menuGarage.innerHTML = "";
      if (garage.length === 0) {
        menuGarage.innerHTML = '<div style="color: #555; grid-column: 1/-1;">Пока пусто...</div>';
      } else {
        garage.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "inv-card " + item.rarity;
          div.innerHTML = `
            <div class="card-plate">${item.text}</div>
            <div class="card-price">${formatMoney(item.price)} ₽</div>
            <div class="card-actions">
              <button class="card-btn btn-sell" onclick="sellItem('garage', ${index})">Продать</button>
              <button class="card-btn btn-safe" onclick="moveToSafe(${index})">В сейф</button>
            </div>
          `;
          menuGarage.appendChild(div);
        });
      }

      // Сейф
      menuSafe.innerHTML = "";
      if (safe.length === 0) {
        menuSafe.innerHTML = '<div style="color: #555; grid-column: 1/-1;">Пока пусто...</div>';
      } else {
        safe.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "inv-card " + item.rarity;
          div.innerHTML = `
            <div class="card-plate">${item.text}</div>
            <div class="card-price">${formatMoney(item.price)} ₽</div>
            <div class="card-actions">
              <button class="card-btn btn-sell" onclick="sellItem('safe', ${index})">Продать</button>
              <button class="card-btn btn-unsafe" onclick="moveToGarage(${index})">В гараж</button>
            </div>
          `;
          menuSafe.appendChild(div);
        });
      }
    }

    // Глобальные функции для кнопок
    window.sellItem = function(location, index) {
      const list = location === 'garage' ? garage : safe;
      const item = list[index];
      score += item.price;
      list.splice(index, 1); // Удаляем
      save();
      render();
    };

    window.moveToSafe = function(index) {
      if (safe.length >= 50) { alert("Сейф переполнен (макс 50)!"); return; } // Ограничение сейфа
      const item = garage[index];
      garage.splice(index, 1);
      safe.push(item);
      save();
      render();
    };

    window.moveToGarage = function(index) {
      if (garage.length >= maxGarage) { alert("Гараж переполнен! Расширь его."); return; }
      const item = safe[index];
      safe.splice(index, 1);
      garage.push(item);
      save();
      render();
    };

    function render() {
      scoreEl.textContent = formatMoney(score);
      countEl.textContent = garage.length;
      maxGarageEl.textContent = maxGarage;
      
      const upgradeCost = 500000;
      if (score >= upgradeCost) {
        upgradeBtn.disabled = false;
        upgradeBtn.textContent = formatMoney(upgradeCost) + " ₽";
      } else {
        upgradeBtn.disabled = true;
        upgradeBtn.textContent = "Нужно " + formatMoney(upgradeCost) + " ₽";
      }

      renderMenu(); // Обновляем списки в меню
    }

    gameArea.addEventListener("click", () => {
      if (currentPlate && !isGenerating) {
        collect();
      } else if (!isGenerating && !currentPlate) {
        spin();
      }
    });

    upgradeBtn.addEventListener("click", () => {
      const cost = 500000;
      if (score >= cost) {
        score -= cost;
        maxGarage += 5;
        save();
        render();
      }
    });

    menuBtn.addEventListener("click", () => modal.classList.add("active"));
    closeModal.addEventListener("click", () => modal.classList.remove("active"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

    render();
  </script>
</body>
</html>
