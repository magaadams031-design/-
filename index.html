<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TZN 228 — Номера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, #1a1a1a, #000);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* УБРАЛИ ОСТРОВОК, СДЕЛАЛИ УГЛЫ ЭКРАНА */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    
    .menu-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .menu-btn:hover { transform: scale(1.1); color: #ff9800; }

    .top-stats {
      display: flex;
      gap: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(0,0,0,0.5); /* Легкая подложка, чтобы текст не сливался */
      padding: 8px 15px;
      border-radius: 10px;
      border: 1px solid #222;
    }
    .stat-item span { color: #4caf50; font-weight: 800; }
    .stat-item.garage-stat span { color: #4fc3f7; }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      cursor: pointer;
      padding-top: 80px;
      padding-bottom: 50px;
    }

    /* ====== РЕАЛИСТИЧНЫЙ НОМЕР С ФЛАГОМ ====== */
    .real-plate {
      display: flex;
      align-items: center;
      background: #fff;
      border: 4px solid #000;
      border-radius: 8px;
      padding: 8px 15px 8px 8px;
      box-shadow: 0 0 40px rgba(255,255,255,0.1), inset 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      transition: all 0.2s ease;
      position: relative;
    }
    .real-plate.generating {
      opacity: 0.3;
      filter: blur(3px);
    }

    /* Левая часть с флагом */
    .plate-flag {
      display: flex;
      flex-direction: column;
      width: 25px;
      height: 45px;
      margin-right: 15px;
      border: 1px solid #ccc;
    }
    .flag-white { flex: 1; background: #fff; }
    .flag-blue { flex: 1; background: #0039a6; }
    .flag-red { flex: 1; background: #d52b1e; }

    /* Основная часть с текстом */
    .plate-main {
      display: flex;
      align-items: center;
      font-family: 'Arial Narrow', 'Arial', sans-serif;
      font-weight: bold;
      font-size: 5rem;
      color: #000;
      letter-spacing: 2px;
      line-height: 1;
      padding-right: 15px;
    }
    
    /* Правая часть с регионом */
    .plate-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 3px solid #000;
      padding-left: 15px;
      height: 100%;
    }
    
    .plate-region {
      font-size: 1.4rem;
      font-weight: bold;
      color: #000;
      line-height: 1;
      margin-bottom: 2px;
    }
    
    .plate-rus {
      font-size: 0.65rem;
      color: #000;
      text-align: center;
      line-height: 1;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .rarity-tag {
      font-size: 1.2rem;
      font-weight: 800;
      padding: 10px 30px;
      border-radius: 30px;
      background: #222;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    
    .rarity-tag.legendary { background: linear-gradient(90deg, #ffd54f, #ff9800); color: #000; box-shadow: 0 0 30px #ffd54f; }
    .rarity-tag.mythic { background: linear-gradient(90deg, #e91e63, #9c27b0); color: #fff; box-shadow: 0 0 30px #e91e63; }
    .rarity-tag.ultra { background: linear-gradient(90deg, #00bcd4, #3f51b5); color: #fff; box-shadow: 0 0 30px #00bcd4; }
    .rarity-tag.epic { background: rgba(186, 104, 200, 0.2); color: #ba68c8; border: 1px solid #ba68c8; }
    .rarity-tag.rare { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; border: 1px solid #4fc3f7; }
    .rarity-tag.common { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid #555; }
    
    .price-display {
      font-size: 2.5rem;
      font-weight: 900;
      color: #4caf50;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .price-display.show { opacity: 1; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    
    .modal-content {
      background: #111; border: 1px solid #333; border-radius: 20px;
      width: 90%; max-width: 600px; padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      max-height: 80vh; overflow-y: auto;
    }
    .modal-content h2 { margin-bottom: 20px; font-size: 1.8rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .close-btn { float: right; cursor: pointer; color: #f44336; font-size: 1.5rem; font-weight: bold; }
    .close-btn:hover { color: #ff5252; }

    .upgrade-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px;
    }
    .upgrade-btn {
      background: #4caf50; color: #fff; border: none; padding: 10px 20px;
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .upgrade-btn:hover { background: #5cb860; }
    .upgrade-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .garage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 50px;
      padding: 0 20px;
    }
    .garage-card {
      background: #141414; border: 1px solid #222; border-radius: 12px;
      padding: 15px; text-align: center; position: relative; overflow: hidden;
    }
    .garage-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
    .garage-card.legendary::before { background: #ffd54f; }
    .garage-card.mythic::before { background: #e91e63; }
    .garage-card.ultra::before { background: #00bcd4; }
    .garage-card.epic::before { background: #ba68c8; }
    .garage-card.rare::before { background: #4fc3f7; }
    .garage-card.common::before { background: #555; }

    .garage-card .card-plate {
      font-family: 'Courier New', monospace; font-size: 1rem; font-weight: 800;
      background: #fff; color: #000; padding: 4px; border-radius: 4px; margin-bottom: 8px; display: inline-block;
    }
    .garage-card .card-price { color: #4caf50; font-weight: 700; font-size: 0.9rem; }
    
    .safe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; }
    .safe-card {
      background: #1e1e1e; border: 1px solid #ffd54f; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; align-items: center;
    }
    .safe-card .card-plate { background: #000; color: #ffd54f; padding: 5px 10px; border-radius: 5px; font-family: monospace; font-weight: bold; font-size: 1.1rem; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: #000; border: 2px solid #ffd54f; padding: 20px 40px; border-radius: 16px;
      text-align: center; z-index: 1000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 50px rgba(255, 213, 79, 0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast h3 { color: #ffd54f; font-size: 1.5rem; margin-bottom: 5px; }
    .toast p { font-size: 1.2rem; color: #fff; }
    .toast .toast-price { color: #4caf50; font-size: 1.8rem; font-weight: 900; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="top-stats">
      <div class="stat-item">Баланс: <span id="score">0</span> ₽</div>
      <div class="stat-item garage-stat">В гараже: <span id="count">0</span>/<span id="maxGarage">10</span></div>
    </div>
  </div>

  <div class="game-area" id="gameArea">
    <div class="real-plate" id="plateContainer">
      <!-- Флаг РФ -->
      <div class="plate-flag">
        <div class="flag-white"></div>
        <div class="flag-blue"></div>
        <div class="flag-red"></div>
      </div>
      <!-- Текст номера -->
      <div class="plate-main" id="plateText">---</div>
      <!-- Регион -->
      <div class="plate-side">
        <div class="plate-region" id="plateRegion">77</div>
        <div class="plate-rus">RUS</div>
      </div>
    </div>

    <div id="rarity" class="rarity-tag common">НАЖМИ, ЧТОБЫ КРУТИТЬ</div>
    <div id="price" class="price-display">0 ₽</div>
  </div>

  <div id="garage" class="garage-grid"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">✖</span>
      <h2>Меню</h2>
      
      <h3 style="margin-bottom: 15px; color: #aaa;">Улучшения</h3>
      <div class="upgrade-item">
        <div>
          <div style="font-weight: bold;">Расширение гаража</div>
          <div style="font-size: 0.8rem; color: #888;">+5 слотов</div>
        </div>
        <button class="upgrade-btn" id="upgradeBtn">500 000 ₽</button>
      </div>

      <h3 style="margin: 25px 0 15px; color: #aaa;">🔒 Сейф (Топ-номера)</h3>
      <div class="safe-grid" id="safeGrid">
        <div style="color: #555;">Пока пусто...</div>
      </div>
      
      <button id="clearBtn" style="margin-top: 30px; background: transparent; border: 1px solid #f44336; color: #f44336; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer;">Сжечь обычный гараж</button>
    </div>
  </div>

  <div class="toast" id="toast">
    <h3 id="toastTitle">ЛЕГЕНДА!</h3>
    <p id="toastText">Вы выбили номер!</p>
    <div class="toast-price" id="toastPrice">0 ₽</div>
  </div>

  <script>
    const letters = ["А","В","Е","К","М","Н","О","Р","С","Т","У","Х"];
    const regions = ["77","50","99","78","47","23","61","16","02","66","52","24"];
    
    let score = parseInt(localStorage.getItem("score")) || 0;
    let garage = JSON.parse(localStorage.getItem("garage")) || [];
    let safe = JSON.parse(localStorage.getItem("safe")) || [];
    let maxGarage = parseInt(localStorage.getItem("maxGarage")) || 10;
    let currentPlate = null, currentRarity = "common", currentPrice = 0;
    let isGenerating = false;

    const scoreEl = document.getElementById("score"), countEl = document.getElementById("count"), maxGarageEl = document.getElementById("maxGarage");
    const plateContainer = document.getElementById("plateContainer"), plateTextEl = document.getElementById("plateText"), plateRegionEl = document.getElementById("plateRegion");
    const rarityEl = document.getElementById("rarity"), priceEl = document.getElementById("price");
    const gameArea = document.getElementById("gameArea"), garageEl = document.getElementById("garage");
    const modal = document.getElementById("modal"), menuBtn = document.getElementById("menuBtn"), closeModal = document.getElementById("closeModal");
    const upgradeBtn = document.getElementById("upgradeBtn"), clearBtn = document.getElementById("clearBtn");
    const safeGrid = document.getElementById("safeGrid");
    const toast = document.getElementById("toast"), toastTitle = document.getElementById("toastTitle"), toastText = document.getElementById("toastText"), toastPrice = document.getElementById("toastPrice");

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function formatMoney(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

    function save() {
      localStorage.setItem("score", score);
      localStorage.setItem("garage", JSON.stringify(garage));
      localStorage.setItem("safe", JSON.stringify(safe));
      localStorage.setItem("maxGarage", maxGarage);
    }

    function generatePlate() {
      const roll = Math.random() * 100;
      
      if (roll < 0.05) return { text: "Т228ЗОН", region: "228", rarity: "mythic", points: 150000000 };
      if (roll < 0.2) return { text: "О001ОО", region: "77", rarity: "mythic", points: 50000000 };
      if (roll < 0.7) return { text: "А777АА", region: "99", rarity: "ultra", points: 15000000 };
      if (roll < 2.2) return { text: "Е999КХ", region: "50", rarity: "legendary", points: 5000000 };

      const l1 = rand(letters), digits = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0"), l2 = rand(letters), l3 = rand(letters), region = rand(regions);
      const text = `${l1}${digits}${l2}${l3}`;
      
      const d = digits.split("");
      if (d[0] === d[1] || d[1] === d[2] || l1 === l2 || l2 === l3 || l1 === l3) 
        return { text, region, rarity: "epic", points: 800000 };
      if (digits === "123" || digits === "321" || digits === "789" || digits === "987") 
        return { text, region, rarity: "rare", points: 200000 };
      
      return { text, region, rarity: "common", points: Math.floor(Math.random() * 50000) + 30000 };
    }

    function spin() {
      if (isGenerating) return;
      isGenerating = true;
      
      plateContainer.classList.add("generating");
      rarityEl.className = "rarity-tag common";
      rarityEl.textContent = "КРУТИМ...";
      priceEl.classList.remove("show");
      priceEl.textContent = "";
      
      let ticks = 0;
      const spinInterval = setInterval(() => {
        const temp = generatePlate();
        plateTextEl.textContent = temp.text;
        plateRegionEl.textContent = temp.region;
        ticks++;
        if (ticks > 10) {
          clearInterval(spinInterval);
          finishSpin();
        }
      }, 50);
    }

    function finishSpin() {
      const result = generatePlate();
      currentPlate = result.text;
      currentRarity = result.rarity;
      currentPrice = result.points;
      
      plateContainer.classList.remove("generating");
      plateTextEl.textContent = result.text;
      plateRegionEl.textContent = result.region;
      
      rarityEl.className = "rarity-tag " + result.rarity;
      rarityEl.textContent = getRarityName(result.rarity);
      
      priceEl.textContent = `${formatMoney(result.points)} ₽`;
      priceEl.classList.add("show");
      
      isGenerating = false;

      if (["legendary", "ultra", "mythic"].includes(result.rarity)) {
        showToast(result);
      }
    }

    function getRarityName(r) {
      if (r === "mythic") return "МИФИЧЕСКИЙ";
      if (r === "ultra") return "УЛЬТРА";
      if (r === "legendary") return "ЛЕГЕНДАРНЫЙ";
      if (r === "epic") return "ЭПИЧЕСКИЙ";
      if (r === "rare") return "РЕДКИЙ";
      return "ОБЫЧНЫЙ";
    }

    function collect() {
      if (isGenerating || !currentPlate) return;
      
      if (["legendary", "ultra", "mythic"].includes(currentRarity)) {
        safe.push({ text: currentPlate, rarity: currentRarity, price: currentPrice });
      } else {
        if (garage.length >= maxGarage) {
          alert("Гараж переполнен! Купи улучшение или очисти гараж.");
          return;
        }
        garage.push({ text: currentPlate, rarity: currentRarity, price: currentPrice });
      }
      
      score += currentPrice;
      
      // Очищаем текущий номер (исчезает)
      currentPlate = null;
      plateTextEl.textContent = "---";
      plateRegionEl.textContent = "77";
      rarityEl.className = "rarity-tag common";
      rarityEl.textContent = "НАЖМИ, ЧТОБЫ КРУТИТЬ";
      priceEl.classList.remove("show");
      priceEl.textContent = "";
      
      save();
      render();
    }

    function showToast(res) {
      toastTitle.textContent = getRarityName(res.rarity) + "!";
      toastText.textContent = res.text + " (" + res.region + ")";
      toastPrice.textContent = formatMoney(res.points) + " ₽";
      toast.classList.add("show");
      
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function render() {
      scoreEl.textContent = formatMoney(score);
      countEl.textContent = garage.length;
      maxGarageEl.textContent = maxGarage;
      
      garageEl.innerHTML = "";
      garage.slice().reverse().forEach(item => { 
        const div = document.createElement("div"); 
        div.className = "garage-card " + item.rarity; 
        div.innerHTML = `<div class="card-plate">${item.text}</div><div class="card-price">${formatMoney(item.price)} ₽</div>`; 
        garageEl.appendChild(div); 
      });
      
      safeGrid.innerHTML = "";
      if (safe.length === 0) {
        safeGrid.innerHTML = '<div style="color: #555; grid-column: 1 / -1;">Пока пусто...</div>';
      } else {
        safe.slice().reverse().forEach(item => {
          const div = document.createElement("div");
          div.className = "safe-card";
          div.innerHTML = `<div class="card-plate">${item.text}</div><div style="font-size: 0.8rem; color: #ffd54f; margin-top: 5px;">${formatMoney(item.price)} ₽</div>`;
          safeGrid.appendChild(div);
        });
      }
      
      const upgradeCost = 500000;
      if (score >= upgradeCost) {
        upgradeBtn.disabled = false;
        upgradeBtn.textContent = formatMoney(upgradeCost) + " ₽";
      } else {
        upgradeBtn.disabled = true;
        upgradeBtn.textContent = "Нужно " + formatMoney(upgradeCost) + " ₽";
      }
    }

    gameArea.addEventListener("click", () => {
      if (currentPlate && !isGenerating) {
        collect();
      } else if (!isGenerating && !currentPlate) {
        spin();
      }
    });

    upgradeBtn.addEventListener("click", () => {
      const cost = 500000;
      if (score >= cost) {
        score -= cost;
        maxGarage += 5;
        save();
        render();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Продать все обычные номера из гаража? Сейф останется нетронутым.")) {
        garage.forEach(item => score += item.price);
        garage = [];
        save();
        render();
      }
    });

    menuBtn.addEventListener("click", () => modal.classList.add("active"));
    closeModal.addEventListener("click", () => modal.classList.remove("active"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

    render();
  </script>
</body>
</html>
