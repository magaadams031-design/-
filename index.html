<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тизон228 — Номера</title>
  <style>
    /* Сброс и базовые настройки */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(76, 175, 80, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 152, 0, 0.08), transparent 25%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Шапка */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #4caf50, #ff9800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #888;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Панель статистики */
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      width: 100%;
      max-width: 800px;
      justify-content: center;
    }
    .stat-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 20px 30px;
      text-align: center;
      flex: 1;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .stat-label { color: #666; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .stat-value.money { color: #4caf50; }

    /* Зона с номером */
    .plate-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }
    .plate {
      background: #fff;
      color: #000;
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 3.5rem;
      padding: 20px 50px;
      border-radius: 12px;
      border: 4px solid #333;
      letter-spacing: 4px;
      box-shadow: 0 0 50px rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      text-align: center;
      min-width: 400px;
    }
    .plate.generating { opacity: 0.5; transform: scale(0.95); }
    
    .rarity-tag {
      font-size: 1.2rem;
      font-weight: 700;
      padding: 8px 24px;
      border-radius: 30px;
      background: #222;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    .rarity-tag.legendary { background: rgba(255, 213, 79, 0.2); color: #ffd54f; border: 1px solid #ffd54f; box-shadow: 0 0 20px rgba(255, 213, 79, 0.3); }
    .rarity-tag.epic { background: rgba(186, 104, 200, 0.2); color: #ba68c8; border: 1px solid #ba68c8; }
    .rarity-tag.rare { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; border: 1px solid #4fc3f7; }
    .rarity-tag.common { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid #555; }
    
    .price-display {
      font-size: 2rem;
      font-weight: 800;
      color: #ff9800;
      margin-top: 10px;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.4);
    }

    /* Кнопки */
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 50px;
    }
    button {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 16px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

    .btn-generate {
      background: #4caf50;
      color: #fff;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    .btn-generate:hover:not(:disabled) { background: #5cb860; box-shadow: 0 6px 25px rgba(76, 175, 80, 0.6); transform: translateY(-2px); }

    .btn-save {
      background: #ff9800;
      color: #000;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
    }
    .btn-save:hover:not(:disabled) { background: #ffa726; box-shadow: 0 6px 25px rgba(255, 152, 0, 0.5); transform: translateY(-2px); }

    /* Гараж */
    .garage-section {
      width: 100%;
      max-width: 900px;
    }
    .garage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #222;
      padding-bottom: 10px;
    }
    .garage-header h2 { font-size: 1.5rem; font-weight: 600; }
    .btn-clear {
      background: transparent;
      color: #f44336;
      font-size: 0.9rem;
      padding: 8px 16px;
      border: 1px solid #f44336;
    }
    .btn-clear:hover { background: rgba(244, 67, 54, 0.1); transform: none; }

    .garage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }
    .garage-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .garage-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    }
    .garage-card.legendary::before { background: #ffd54f; }
    .garage-card.epic::before { background: #ba68c8; }
    .garage-card.rare::before { background: #4fc3f7; }
    .garage-card.common::before { background: #555; }

    .garage-card .card-plate {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      font-weight: 800;
      background: #fff;
      color: #000;
      padding: 5px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: inline-block;
    }
    .garage-card .card-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1rem;
    }
    .garage-card .card-rarity {
      font-size: 0.7rem;
      color: #888;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ТИЗОН 228</h1>
    <p class="subtitle">Генератор премиум номеров</p>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Баланс</div>
      <div class="stat-value money"><span id="score">0</span> ₽</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">В гараже</div>
      <div class="stat-value"><span id="count">0</span> шт</div>
    </div>
  </div>

  <div class="plate-zone">
    <div id="plate" class="plate">---</div>
    <div id="rarity" class="rarity-tag common">ОЖИДАНИЕ</div>
    <div id="price" class="price-display"></div>
  </div>

  <div class="controls">
    <button id="genBtn" class="btn-generate">🎲 Крутить</button>
    <button id="saveBtn" class="btn-save" disabled>💾 Забрать</button>
  </div>

  <div class="garage-section">
    <div class="garage-header">
      <h2>🏠 Мой Гараж</h2>
      <button id="clearBtn" class="btn-clear">Сжечь гараж</button>
    </div>
    <div id="garage" class="garage-grid"></div>
  </div>

  <script>
    const letters = ["А","В","Е","К","М","Н","О","Р","С","Т","У","Х"];
    const regions = ["77","50","99","78","47","23","61","16","02","66","52","24"];
    let currentPlate = null, currentRarity = "common", currentPrice = 0, score = 0, garage = [];
    
    if (localStorage.getItem("garage")) garage = JSON.parse(localStorage.getItem("garage"));
    if (localStorage.getItem("score")) score = parseInt(localStorage.getItem("score"));
    
    const plateEl = document.getElementById("plate"), rarityEl = document.getElementById("rarity"), priceEl = document.getElementById("price"), scoreEl = document.getElementById("score"), countEl = document.getElementById("count"), garageEl = document.getElementById("garage"), genBtn = document.getElementById("genBtn"), saveBtn = document.getElementById("saveBtn"), clearBtn = document.getElementById("clearBtn");
    
    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    
    function generatePlate() {
      if (Math.random() < 0.01) return { text: "Т228ЗОН 228", digits: "228", l1: "Т", l2: "З", l3: "Н", easter: true };
      const l1 = rand(letters), digits = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0"), l2 = rand(letters), l3 = rand(letters), region = rand(regions);
      return { text: `${l1}${digits}${l2}${l3} ${region}`, digits, l1, l2, l3 };
    }
    
    function getRarity(p) {
      if (p.easter) return { level: "legendary", name: "СЕКРЕТ ТИЗОНА", points: 10000000 };
      const { digits, l1, l2, l3 } = p, d = digits.split("");
      if (digits === "777" || digits === "001" || digits === "100" || (l1 === l2 && l2 === l3)) return { level: "legendary", name: "ЛЕГЕНДАРНЫЙ", points: 3000000 };
      if (d[0] === d[1] || d[1] === d[2] || l1 === l2 || l2 === l3 || l1 === l3) return { level: "epic", name: "ЭПИЧЕСКИЙ", points: 800000 };
      if (digits === "123" || digits === "321" || digits === "789" || digits === "987") return { level: "rare", name: "РЕДКИЙ", points: 200000 };
      const basePrice = Math.floor(Math.random() * 50000) + 30000;
      return { level: "common", name: "ОБЫЧНЫЙ", points: basePrice };
    }
    
    function formatMoney(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    
    function render() {
      scoreEl.textContent = formatMoney(score); 
      countEl.textContent = garage.length; 
      garageEl.innerHTML = "";
      
      // Отрисовка карточек в гараже
      garage.slice().reverse().forEach(item => { 
        const div = document.createElement("div"); 
        div.className = "garage-card " + item.rarity; 
        div.innerHTML = `
          <div class="card-plate">${item.text}</div>
          <div class="card-price">${formatMoney(item.price)} ₽</div>
          <div class="card-rarity">${item.rarity === 'legendary' ? 'ЛЕГЕНДА' : item.rarity === 'epic' ? 'ЭПИК' : item.rarity === 'rare' ? 'РЕДКИЙ' : 'ОБЫЧНЫЙ'}</div>
        `; 
        garageEl.appendChild(div); 
      });
    }
    
    genBtn.addEventListener("click", () => {
      plateEl.classList.add("generating");
      plateEl.textContent = "...";
      rarityEl.className = "rarity-tag common"; rarityEl.textContent = "КРУТИМ...";
      priceEl.textContent = "";
      
      setTimeout(() => {
        const p = generatePlate(), r = getRarity(p); 
        currentPlate = p.text; currentRarity = r.level; currentPrice = r.points;
        
        plateEl.classList.remove("generating");
        plateEl.textContent = p.text;
        
        rarityEl.textContent = r.name; 
        rarityEl.className = "rarity-tag " + r.level;
        priceEl.textContent = `${formatMoney(r.points)} ₽`;
        
        saveBtn.disabled = false; 
        saveBtn.textContent = `💾 Забрать`;
      }, 150); // Небольшая задержка для эффекта "кручения"
    });
    
    saveBtn.addEventListener("click", () => {
      if (!currentPlate) return;
      garage.push({ text: currentPlate, rarity: currentRarity, price: currentPrice }); 
      score += currentPrice;
      
      localStorage.setItem("garage", JSON.stringify(garage)); 
      localStorage.setItem("score", score);
      
      saveBtn.disabled = true; 
      saveBtn.textContent = "💾 Забрать"; 
      render();
    });
    
    clearBtn.addEventListener("click", () => {
      if (confirm("Сжечь весь гараж? Деньги тоже сгорят!")) { 
        garage = []; score = 0; 
        localStorage.removeItem("garage"); 
        localStorage.removeItem("score"); 
        render(); 
      }
    });
    
    render();
  </script>
</body>
</html>
